[package]
name = "sentinel-kernel"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Tesla Kernel — custom CPU/CUDA compute (no third-party math libs)"

[features]
default = []
# Enable Tesla-2 CUDA context (requires CUDA toolkit for real device launch)
cuda = []

[dependencies]
sentinel-core = { workspace = true }
rayon = { workspace = true }
bytemuck = { workspace = true }
num-traits = { workspace = true }
log = { workspace = true }
serde = { workspace = true }

# dlopen for CUDA driver
[target.'cfg(target_os = "linux")'.dependencies]
# libc not required; we use raw extern dlopen
